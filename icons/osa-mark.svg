<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Marca O Sentido Autêntico — rolo de manuscrito">
  <!-- fundo -->
  <rect width="64" height="64" rx="14" fill="#0F3731"/>

  <!-- folha esticada do manuscrito -->
  <path d="M16 20h32v24H16z" fill="#FBFAF7"/>
  <!-- vinco horizontal do pergaminho -->
  <path d="M16 32h32" stroke="#F5EBD8" stroke-width="1"/>

  <!-- linhas de escrita -->
  <path d="M22 26.5h20M22 32h20M22 37.5h14" stroke="#0F3731" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- rolo esquerdo (cilindro vertical enrolado) -->
  <rect x="8" y="14" width="12" height="36" rx="6" fill="#C5A059"/>
  <!-- espiral topo esquerda -->
  <path d="M14 17.5c2.2 0 3.5 1.6 3.5 3.8s-1.3 3.8-3.5 3.8" fill="none" stroke="#7A5C1E" stroke-width="1.75" stroke-linecap="round"/>
  <!-- espiral base esquerda -->
  <path d="M14 42.5c2.2 0 3.5 1.6 3.5 3.8s-1.3 3.8-3.5 3.8" fill="none" stroke="#7A5C1E" stroke-width="1.75" stroke-linecap="round"/>
  <!-- luz no cilindro esquerdo -->
  <path d="M11.5 22v20" stroke="#F5EBD8" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

  <!-- rolo direito -->
  <rect x="44" y="14" width="12" height="36" rx="6" fill="#C5A059"/>
  <!-- espiral topo direita -->
  <path d="M50 17.5c-2.2 0-3.5 1.6-3.5 3.8s1.3 3.8 3.5 3.8" fill="none" stroke="#7A5C1E" stroke-width="1.75" stroke-linecap="round"/>
  <!-- espiral base direita -->
  <path d="M50 42.5c-2.2 0-3.5 1.6-3.5 3.8s1.3 3.8 3.5 3.8" fill="none" stroke="#7A5C1E" stroke-width="1.75" stroke-linecap="round"/>
  <!-- luz no cilindro direito -->
  <path d="M52.5 22v20" stroke="#F5EBD8" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

  <!-- dobradiças da folha sob os rolos -->
  <path d="M16 20h6v24h-6" fill="#F5EBD8"/>
  <path d="M42 20h6v24h-6" fill="#F5EBD8"/>
</svg>
