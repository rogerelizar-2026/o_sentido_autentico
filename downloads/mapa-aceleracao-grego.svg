<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Mapa de aceleração do grego koiné em cinco níveis: Fundação, Básico, Intermediário, Avançado e Fluência, com os marcos de cada fase e o símbolo cristão ΙΧΘΥΣ.">
  <rect width="960" height="540" fill="#FBFAF7"/>
  <rect width="960" height="84" fill="#0F3731"/>
  <text x="40" y="40" font-family="Georgia,serif" font-size="26" font-weight="700" fill="#C5A059">Mapa de Aceleração — Grego Koiné</text>
  <text x="40" y="66" font-family="Arial,sans-serif" font-size="14" fill="#F3EFE6">Grego koiné — rota de 5 níveis (30–60 min/dia) · Rega/Mounce para morfologia · Wallace para sintaxe</text>

  <!-- Símbolo ΙΧΘΥΣ (peixe cristão), marca da página de grego -->
  <g transform="translate(772 10) scale(0.55)" fill="none" stroke="#C5A059" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 60 C 78 20, 168 20, 208 60"/>
