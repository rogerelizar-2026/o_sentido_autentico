  <text x="40" y="470" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#0F3731">Método vencedor (integração Rega/Mounce + Wallace):</text>
  <text x="40" y="494" font-family="Arial,sans-serif" font-size="14" fill="#1A2530">Traduzir com Rega/Mounce → parsing completo → consultar Wallace na seção do fenômeno → nota exegética de 3–5 linhas.</text>
  <text x="40" y="522" font-family="Arial,sans-serif" font-size="12" fill="#4A5568">Estimativa editorial de setembro de 2026 — não é cronograma oficial de editoras. O Sentido Autêntico · Rogério Ramão Lopes</text>
