  <text x="40" y="470" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#0F3731">Método vencedor (integração híbrida):</text>
  <text x="40" y="494" font-family="Arial,sans-serif" font-size="14" fill="#1A2530">Leitura direta do texto + gramática ativa (parsing) + Anki (repetição espaçada) + coaching textual com mentor/grupo.</text>
  <text x="40" y="522" font-family="Arial,sans-serif" font-size="12" fill="#4A5568">Estimativa editorial de cronologia do projeto — não é cronograma oficial de editoras. O Sentido Autêntico · Rogério Ramão Lopes</text>
