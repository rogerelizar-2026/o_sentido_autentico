<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Em Breve | Caixa de Ferramentas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #fbfaf7; --surface: #ffffff; --text: #1a2530; --text-muted: #4a5568; --primary: #0f3731; --gold: #c5a059; --border: #e2dcd0; }
        .dark { --bg: #0f141c; --surface: #1a2333; --text: #e2e8f0; --text-muted: #a0aec0; --primary: #e2b765; --gold: #e2b765; --border: #2d3748; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; transition: all 0.3s ease; }
        .container { text-align: center; max-width: 600px; }
        .icon { font-size: 80px; margin-bottom: 24px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        h1 { font-family: 'Cinzel', serif; font-size: 32px; color: var(--primary); margin-bottom: 16px; }
        p { font-size: 16px; color: var(--text-muted); line-height: 1.6; margin-bottom: 32px; }
        .btn { display: inline-block; padding: 14px 32px; background: var(--primary); color: #fff; border-radius: 12px; font-weight: 700; text-decoration: none; transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(197, 160, 89, 0.2); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(197, 160, 89, 0.3); filter: brightness(1.1); }
        .dark .btn { color: #1a1608; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; width: 44px; height: 44px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">🌙</button>
    <div class="container">
        <div class="icon">⏳</div>
        <h1 class="font-display">Em breve...</h1>
        <p>Esta página está passando por uma transformação cuidadosa. A nova <strong>Caixa de Ferramentas</strong> será lançada em breve com recursos aprimorados para sua pesquisa bíblica.</p>
        <p style="font-size: 14px; margin-top: -16px;">Enquanto isso, explore nossa versão atualizada:</p>
        <a href="caixa-de-ferramentas.html" class="btn">Acessar Nova Versão →</a>
    </div>
    <script>
        const toggle = document.getElementById('themeToggle');
        const isDark = localStorage.getItem('osa_theme') === 'dark';
        if (isDark) { document.body.classList.add('dark'); toggle.textContent = '☀️'; }
        toggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            const dark = document.body.classList.contains('dark');
            localStorage.setItem('osa_theme', dark ? 'dark' : 'light');
            toggle.textContent = dark ? '☀️' : '🌙';
        });
    </script>
</body>
</html>
