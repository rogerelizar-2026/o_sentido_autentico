        /* =========================================
           1. DESIGN SYSTEM & VARIABLES (Shared with O Sentido Autêntico)
           ========================================= */
        :root {
            /* Light Theme - Aligned with O Sentido Autêntico */
            --bg: #fbfaf7;
            --surface: #ffffff;
            --surface-2: #f3efe6;
            --text: #1a2530;
            --text-muted: #4a5568;
            --primary: #0f3731; /* Portal Emerald */
            --primary-soft: rgba(15, 55, 49, 0.08);
            --gold: #c5a059;
            --gold-dark: #a3803b;
            --border: #e2dcd0;
            --shadow: rgba(26, 37, 48, 0.06);
            
            /* Language Colors */
            --hebrew: #102a43;
            --aramaic: #243e56;
            --greek: #7b1d22;
            --general: #0f3731;

            /* UI Constants */
            --header-height: 70px;
            --sidebar-width: 280px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .dark {
            --bg: #0f141c;
            --surface: #1a2333;
            --surface-2: #171e29;
            --text: #e2e8f0;
            --text-muted: #a0aec0;
            --primary: #e2b765; /* Gold accent in dark */
            --primary-soft: rgba(226, 183, 101, 0.12);
            --gold: #e2b765;
            --gold-dark: #c59f51;
            --border: #2d3748;
            --shadow: rgba(0, 0, 0, 0.4);
            --hebrew: #7da2f0;
            --aramaic: #f0b265;
            --greek: #65d6a8;
            --general: #c3a1f5;
        }

        /* Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; transition: background 0.5s ease, color 0.5s ease; overflow-x: hidden; }
        h1, h2, h3, h4 { font-family: 'Cinzel', serif; color: var(--primary); }
        p, li { font-family: 'Lora', serif; line-height: 1.6; color: var(--text); }
        a { text-decoration: none; color: inherit; transition: var(--transition); }
        button { font-family: 'Inter', sans-serif; cursor: pointer; border: none; background: none; color: inherit; }

        /* Typography Utilities */
        .font-display { font-family: 'Cinzel', serif; }
        .text-gold { color: var(--gold); }
        .text-muted { color: var(--text-muted); }
        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }

        /* Components */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px 20px; border-radius: var(--radius-md); font-weight: 600; font-size: 14px;
            transition: var(--transition); white-space: nowrap;
        }
        .btn-primary {
            background: var(--primary); color: #fff;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.2);
        }
        .dark .btn-primary { color: #1a1608; }
        .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.1); }
        
        .btn-outline {
            border: 1px solid var(--border); background: var(--surface); color: var(--text);
        }
        .btn-outline:hover { border-color: var(--gold); color: var(--gold); }

        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 20px;
            box-shadow: 0 4px 15px var(--shadow);
            transition: var(--transition);
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }

        .badge {
            display: inline-block; padding: 4px 10px; border-radius: 99px;
            font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .badge-hebrew { background: rgba(16, 42, 67, 0.1); color: var(--hebrew); }
        .badge-greek { background: rgba(123, 29, 34, 0.1); color: var(--greek); }
        .badge-aramaic { background: rgba(36, 62, 86, 0.1); color: var(--aramaic); }
        .badge-general { background: rgba(15, 55, 49, 0.1); color: var(--general); }
        .dark .badge-hebrew { background: rgba(125, 162, 240, 0.15); }
        .dark .badge-greek { background: rgba(101, 214, 168, 0.15); }

        /* Layout Structure */
        .app-container { display: flex; min-height: 100vh; position: relative; }
        
        /* Header */
        .main-header {
            position: fixed; top: 0; left: 0; right: 0; height: var(--header-height);
            background: rgba(var(--bg), 0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); z-index: 1000;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px;
        }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-size: 24px; color: var(--gold); }
        .logo-text { font-family: 'Cinzel', serif; font-weight: 700; font-size: 18px; color: var(--primary); }
        .logo-sub { font-family: 'Inter', sans-serif; font-size: 12px; color: var(--text-muted); font-weight: 400; margin-left: 8px; display: none; }
        @media(min-width: 768px) { .logo-sub { display: inline; } }

        .header-actions { display: flex; align-items: center; gap: 16px; }
        .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-muted); transition: var(--transition); }
        .icon-btn:hover { background: var(--surface-2); color: var(--primary); }

        /* Sidebar */
        .sidebar {
            position: fixed; top: var(--header-height); left: 0; bottom: 0;
            width: var(--sidebar-width); background: var(--surface);
            border-right: 1px solid var(--border); z-index: 900;
            transform: translateX(-100%); transition: transform 0.3s ease;
            padding: 20px; display: flex; flex-direction: column;
        }
        .sidebar.open { transform: translateX(0); }
        @media(min-width: 1024px) {
            .sidebar { transform: translateX(0); position: sticky; top: var(--header-height); height: calc(100vh - var(--header-height)); }
            .menu-toggle { display: none; }
        }

        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            border-radius: var(--radius-md); color: var(--text-muted); font-weight: 600;
            margin-bottom: 4px; transition: var(--transition);
        }
        .nav-item:hover, .nav-item.active { background: var(--primary-soft); color: var(--primary); }
        .nav-item i { width: 20px; text-align: center; }

        /* Main Content */
        .main-content {
            flex: 1; margin-top: var(--header-height); margin-left: 0;
            padding: 24px; transition: margin-left 0.3s ease;
            max-width: 1400px; margin: var(--header-height) auto 0;
        }
        @media(min-width: 1024px) { .main-content { margin-left: var(--sidebar-width); max-width: calc(1400px - var(--sidebar-width)); } }

        /* Dashboard Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
        .stat-card { text-align: center; padding: 20px; }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--primary); font-family: 'Cinzel', serif; }
        .stat-label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

        /* Filters */
        .filters-bar {
            display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px;
            padding: 16px; background: var(--surface); border-radius: var(--radius-lg);
            border: 1px solid var(--border);
        }
        .filter-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 150px; }
        .filter-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
        .filter-select {
            padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px;
        }

        /* Resource Grid */
        .resource-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
        .resource-card { display: flex; flex-direction: column; height: 100%; position: relative; overflow: hidden; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .card-title { font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
        .card-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 16px; flex-grow: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .card-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
        .card-actions { display: flex; gap: 8px; margin-top: auto; border-top: 1px solid var(--border); padding-top: 12px; }
        .card-actions .btn { flex: 1; font-size: 12px; padding: 8px; }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(11, 15, 23, 0.7); backdrop-filter: blur(4px);
            z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; animation: fadeIn 0.3s ease; }
        .modal-content {
            background: var(--surface); width: 100%; max-width: 600px; max-height: 90vh;
            overflow-y: auto; border-radius: var(--radius-lg); padding: 32px;
            position: relative; border: 1px solid var(--border);
            animation: slideUp 0.3s ease;
        }
        .modal-close { position: absolute; top: 16px; right: 16px; color: var(--text-muted); font-size: 20px; }
        
        /* Floating Message (Coming Soon) */
        .floating-msg {
            position: fixed; bottom: 30px; right: 30px;
            background: var(--primary); color: #fff;
            padding: 12px 24px; border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            font-weight: 600; font-size: 14px; z-index: 3000;
            display: flex; align-items: center; gap: 10px;
            animation: floatUp 0.5s ease;
        }
        .floating-msg i { color: var(--gold); }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes floatUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Utility for disabled links */
        .disabled-link { pointer-events: none; opacity: 0.6; cursor: not-allowed; }
        
        /* Responsive Tweaks */
        @media(max-width: 768px) {
            .filters-bar { flex-direction: column; }
            .filter-group { width: 100%; }
            .resource-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

                filterLevel: "Nivel",
                optAll: "Todos",
                optSoftware: "Software/App",
                optWebsite: "Sitio/BD",
                optBook: "Libro/Gramática",
                optCourse: "Curso/Video",
                optBeginner: "Principiante",
                optIntermediate: "Intermedio",
                optAdvanced: "Avanzado/Académico",
                comingSoon: "Pronto: Gestión de Proyectos y Exportación",
                btnDetails: "Detalles",
                btnVisit: "Visitar",
                btnSave: "Guardar",
                modalCost: "Costo",
                modalBias: "Sesgo Teológico",
                modalBase: "Base Textual",
                costFree: "Gratis",
                costPaid: "Pago",
                costFreemium: "Freemium",
                biasNeutral: "Neutro/Académico",
                biasEvangelical: "Evangélico",
                biasCritical: "Crítico",
                langHebrew: "Hebreo",
                langGreek: "Griego",
                langAramaic: "Arameo",
                langGeneral: "General"
            }
        };

        // =========================================
        // APP LOGIC
        // =========================================
        const app = {
            lang: 'pt',
            theme: 'light',
            
            init() {
                this.loadSettings();
                this.applyTheme();
                this.updateTexts();
                this.renderResources();
                this.updateStats();
                this.setupListeners();
            },

            loadSettings() {
                const savedLang = localStorage.getItem('toolbox_lang');
                const savedTheme = localStorage.getItem('toolbox_theme');
                if (savedLang) this.lang = savedLang;
                if (savedTheme) this.theme = savedTheme;
            },

            toggleTheme() {
                this.theme = this.theme === 'light' ? 'dark' : 'light';
                localStorage.setItem('toolbox_theme', this.theme);
                this.applyTheme();
            },

            applyTheme() {
                document.body.className = this.theme;
                const icon = document.querySelector('#themeToggle i');
                icon.className = this.theme === 'light' ? 'fas fa-moon' : 'fas fa-sun';
            },

            toggleLang() {
                const langs = ['pt', 'en', 'es'];
                let idx = langs.indexOf(this.lang);
                this.lang = langs[(idx + 1) % langs.length];
                localStorage.setItem('toolbox_lang', this.lang);
                this.updateTexts();
                this.renderResources(); // Re-render to update dynamic content
            },

            updateTexts() {
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (translations[this.lang][key]) {
                        el.textContent = translations[this.lang][key];
                    }
                });
                // Update placeholders
                const searchInput = document.getElementById('searchInput');
                if(searchInput) searchInput.placeholder = this.lang === 'pt' ? "Nome, autor ou descrição..." : (this.lang === 'en' ? "Name, author or description..." : "Nombre, autor o descripción...");
            },

            setupListeners() {
                document.getElementById('themeToggle').addEventListener('click', () => this.toggleTheme());
                document.getElementById('langToggle').addEventListener('click', () => this.toggleLang());
                document.getElementById('menuToggle').addEventListener('click', () => {
                    document.getElementById('sidebar').classList.toggle('open');
                });
                
                // Close sidebar when clicking outside on mobile
                document.addEventListener('click', (e) => {
                    const sidebar = document.getElementById('sidebar');
                    const toggle = document.getElementById('menuToggle');
                    if (window.innerWidth < 1024 && 
                        !sidebar.contains(e.target) && 
                        !toggle.contains(e.target) && 
                        sidebar.classList.contains('open')) {
                        sidebar.classList.remove('open');
                    }
                });
            },

            getLabel(key, val) {
                // Helper to translate specific values
                if (key === 'cost') return translations[this.lang][`cost${val.charAt(0).toUpperCase() + val.slice(1)}`] || val;
                if (key === 'bias') return translations[this.lang][`bias${val.charAt(0).toUpperCase() + val.slice(1)}`] || val;
                if (key === 'lang') return translations[this.lang][`lang${val.charAt(0).toUpperCase() + val.slice(1)}`] || val;
                if (key === 'type') return translations[this.lang][`opt${val.charAt(0).toUpperCase() + val.slice(1)}`] || val;
                if (key === 'level') return translations[this.lang][`opt${val.charAt(0).toUpperCase() + val.slice(1)}`] || val;
                return val;
            },

            renderResources() {
                const grid = document.getElementById('resourceGrid');
                const search = document.getElementById('searchInput').value.toLowerCase();
                const typeF = document.getElementById('typeFilter').value;
                const levelF = document.getElementById('levelFilter').value;
                
                // Simple filter logic (can be expanded for sidebar language filter)
                const filtered = resources.filter(r => {
                    const matchesSearch = r.title.toLowerCase().includes(search) || r.desc.toLowerCase().includes(search);
                    const matchesType = typeF === 'all' || r.type === typeF;
                    const matchesLevel = levelF === 'all' || r.level === levelF;
                    return matchesSearch && matchesType && matchesLevel;
                });

                grid.innerHTML = filtered.map(r => `
                    <div class="card resource-card">
                        <div class="card-header">
                            <div>
                                <div class="card-title">${r.title}</div>
                                <span class="badge badge-${r.lang}">${this.getLabel('lang', r.lang)}</span>
                            </div>
                            <i class="fas fa-star" style="color: var(--border); cursor:pointer;" onclick="app.showNotification('Funcionalidade em breve')"></i>
                        </div>
                        <div class="card-desc">${r.desc}</div>
                        <div class="card-meta">
                            <span class="badge" style="background:var(--surface-2); color:var(--text-muted)">${this.getLabel('type', r.type)}</span>
                            <span class="badge" style="background:var(--surface-2); color:var(--text-muted)">${this.getLabel('level', r.level)}</span>
                            <span class="badge" style="background:var(--surface-2); color:var(--text-muted)">${this.getLabel('cost', r.cost)}</span>
                        </div>
                        <div class="card-actions">
                            <button class="btn btn-outline" onclick="app.openModal(${r.id})">${translations[this.lang].btnDetails}</button>
                            <a href="${r.url}" target="_blank" class="btn btn-primary">${translations[this.lang].btnVisit}</a>
                        </div>
                    </div>
                `).join('');

                this.updateStats(filtered.length);
            },

            updateStats(countOverride = null) {
                const count = countOverride !== null ? countOverride : resources.length;
                document.getElementById('countTotal').textContent = count;
                
                const freeCount = resources.filter(r => r.cost === 'free').length;
                document.getElementById('countFree').textContent = freeCount;
            },

            openModal(id) {
                const r = resources.find(x => x.id === id);
                if (!r) return;

                const t = translations[this.lang];
                const html = `
                    <h2 style="margin-bottom:8px; color:var(--primary)">${r.title}</h2>
                    <div style="margin-bottom:20px; display:flex; gap:8px; flex-wrap:wrap">
                        <span class="badge badge-${r.lang}">${this.getLabel('lang', r.lang)}</span>
                        <span class="badge">${this.getLabel('type', r.type)}</span>
                        <span class="badge">${this.getLabel('level', r.level)}</span>
                    </div>
                    <p style="margin-bottom:20px; font-size:16px; line-height:1.7">${r.desc}</p>
                    
                    <div style="background:var(--surface-2); padding:16px; border-radius:8px; margin-bottom:20px">
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px; border-bottom:1px solid var(--border); padding-bottom:4px">
                            <strong>${t.modalBase}:</strong> <span>${r.base}</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px; border-bottom:1px solid var(--border); padding-bottom:4px">
                            <strong>${t.modalBias}:</strong> <span>${this.getLabel('bias', r.bias)}</span>
                        </div>
                        <div style="display:flex; justify-content:space-between;">
                            <strong>${t.modalCost}:</strong> <span>${this.getLabel('cost', r.cost)}</span>
                        </div>
                    </div>

                    <div style="display:flex; gap:12px">
                        <a href="${r.url}" target="_blank" class="btn btn-primary" style="flex:1">${t.btnVisit}</a>
                        <button class="btn btn-outline" onclick="app.showNotification('Salvo nos favoritos (simulado)')">${t.btnSave}</button>
                    </div>
                `;
                
                document.getElementById('modalBody').innerHTML = html;
                document.getElementById('detailModal').classList.add('active');
            },

            closeModal() {
                document.getElementById('detailModal').classList.remove('active');
            },

            showNotification(msg) {
                // Reuse floating msg or create toast
                const float = document.querySelector('.floating-msg span');
                const original = float.textContent;
                float.textContent = msg;
                setTimeout(() => {
                    float.textContent = original;
                }, 3000);
            },

            filterView(lang) {
                // Update active nav
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                event.currentTarget.classList.add('active');
                
                // On mobile close sidebar
                if(window.innerWidth < 1024) document.getElementById('sidebar').classList.remove('open');

                // Filter logic
                const grid = document.getElementById('resourceGrid');
                const filtered = lang === 'all' ? resources : resources.filter(r => r.lang === lang || r.lang === 'general');
                
                // Re-use render logic manually for simplicity here
                const t = translations[this.lang];
                grid.innerHTML = filtered.map(r => `
                    <div class="card resource-card">
                        <div class="card-header">
                            <div>
                                <div class="card-title">${r.title}</div>
                                <span class="badge badge-${r.lang}">${this.getLabel('lang', r.lang)}</span>
                            </div>
                            <i class="fas fa-star" style="color: var(--border); cursor:pointer;" onclick="app.showNotification('Funcionalidade em breve')"></i>
                        </div>
                        <div class="card-desc">${r.desc}</div>
                        <div class="card-meta">
                            <span class="badge" style="background:var(--surface-2); color:var(--text-muted)">${this.getLabel('type', r.type)}</span>
                            <span class="badge" style="background:var(--surface-2); color:var(--text-muted)">${this.getLabel('level', r.level)}</span>
                        </div>
                        <div class="card-actions">
                            <button class="btn btn-outline" onclick="app.openModal(${r.id})">${t.btnDetails}</button>
                            <a href="${r.url}" target="_blank" class="btn btn-primary">${t.btnVisit}</a>
                        </div>
                    </div>
                `).join('');
                this.updateStats(filtered.length);
            }
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
