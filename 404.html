<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Página não encontrada — O Sentido Autêntico</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="./css/main.css">
  <script>
    try {
      var t = localStorage.getItem('osa:theme') || localStorage.getItem('theme');
      if (t !== 'light' && t !== 'dark') t = 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/favicon-48.png" type="image/png">
</head>
<body>
  <main id="main-content" class="osa-main" tabindex="-1">
    <h1>Página não encontrada</h1>
    <p class="lead">O endereço acessado não existe no O Sentido Autêntico.</p>
    <div class="row" style="margin-top:1rem">
      <a class="osa-btn osa-btn--primary" href="./index.html">Portal do Estudante</a>
      <a class="osa-btn osa-btn--outline" href="./caixa-de-ferramentas.html">Caixa de Ferramentas</a>
    </div>
  </main>
</body>
</html>
